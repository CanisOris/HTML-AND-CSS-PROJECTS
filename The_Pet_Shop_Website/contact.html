<!DOCTYPE html>
<html lang="en">

<head>
    <title>HTML Documents Submission Assignment</title>
    <meta name="description" content="Contact us for information">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="nav-bar">
        <ul id="nav-border">
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <header>
        <div>
            <h1 class="animate-text">Contact Us!</h1>
        </div>
    </header>
    <!-- FORM -->
    <section>
        <div>
            <h3 id="contact-h3">Please provide your contact information and a brief message of your inquiry.</h3>
        </div>
        <div>
            <form class="contact-grid">
                <input class="form-textbox" id="firstname" type="text" placeholder="First Name">
                <input class="form-textbox" id="lastname" type="text" placeholder="Last Name">
                <input class="form-textbox" id="email" type="email" placeholder="Email">
                <input class="form-textbox" id="phone" type="tel" placeholder="Phone Number">

                <div class="checkbox-wrapper">
                    <input class="form-checkbox" type="checkbox" id="newsletter">
                    <label for="newsletter">Would you like to receive our monthly newsletter?</label>
                </div>

                <textarea class="form-textbox-multiline" id="message" placeholder="Type the message ...."></textarea>

                <input class="form-submission-button" type="submit" value="Submit">
            </form>
        </div>
    </section>
    <!-- FOOTER -->
    <footer>
        <div class="footer-div">
            <div>
                <p>The Pet Shop!&copy;</p>
            </div>
            <div>
                123 Square Ave<br>
                Portland, OR 97204
            </div>
            <div>503-234-3966</div>

        </div>

    </footer>
</body>

</html>
