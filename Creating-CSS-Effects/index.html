<!DOCTYPE html>
<html lang="en">

<head>
    <title>Creating Effects with CSS</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Tech Acad Instruction">

    <link rel="stylesheet" href="css/style.css">

<body>
    <!-- NAVBAR -->
    <nav id="page-top" class="nav-bar">
    <div class="nav-wrapper">
        <div class="kanji-logo">
            <!-- Added unique IDs to each character -->
            <span class="kanji-char" id="k-ai">合</span>
            <span class="kanji-char" id="k-ki">気</span>
            <span class="kanji-char" id="k-do">道</span>
            
            <!-- Translation container placed as a sibling to the characters -->
            <div class="translation-container">
                <div class="trans-text" id="t-ai">Ai (合): Harmony, joining, or bringing together.</div>
                <div class="trans-text" id="t-ki">Ki (気 / 氣): Spirit, mind, or universal energy/life force.</div>
                <div class="trans-text" id="t-do">Dō (道): The way, path, or method.</div>
            </div>
        </div>
        <div>
            <ul>
                <li>
                    <a href="#">Home</a>
                </li>
                <li class="drop">
                    <a href="#">Images</a>
                    <div class="rollover-menu">
                        <a href="#img1">Image 1</a>
                        <a href="#img2">Image 2</a>
                        <a href="#img3">Image 3</a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>
    <header>

    </header>

    <!-- IMAGES -->
    <section>
        <!-- img 1 -->
        <div class="image-container" id="img1">
            <img src="Images/j1.jpg">
            <div class="overlay"></div>
        </div>
        <!-- img 2 -->
        <div class="image-container" id="img2">
            <img src="Images/j2.jpg" class="zoom">
        </div>
        <!-- img o3 -->
        <div class="image-container" id="img3">
            <div class="circle">
                <img src="Images/j3.jpg">
            </div>
        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-text">
            <p>The Tech Academy &copy;</p>
        </div>
    </footer>
