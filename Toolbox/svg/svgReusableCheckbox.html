<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Sprite Checkboxes - No Animation</title>
  
  <!-- Import Pangolin Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
  
  <style>
    /* Global Variables */
    :root {
      --body-bg: #1e1e24;
      --col-card-bg: #59768f;
      --body-text: #e6e6eb;
    }

    /* Basic page setup */
    body {
      background-color: var(--body-bg);
      color: var(--body-text);
      font-family: 'Pangolin', cursive;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px; 
    }

    /* Base Label Styling */
    .svg-toggle {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      font-size: 1.2rem;
      user-select: none;
      color: var(--body-text);
      transition: color 0.2s ease;
      width: fit-content;
    }

    .svg-toggle:hover {
      color: var(--col-card-bg);
    }

    /* Visually hide the native checkbox */
    .svg-toggle input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    /* Base SVG Icon Styling */
    .svg-toggle .icon {
      width: 26px;
      height: 26px;
      margin-right: 10px;
      flex-shrink: 0;
    }

    /* 
       Static Checkbox Logic via CSS Variables 
    */
    
    /* 1. Default state: checkmark is hidden */
    .box-use-tag {
      --check-opacity: 0;
    }

    /* 2. Checked state: checkmark instantly appears */
    .svg-toggle input[type="checkbox"]:checked ~ .box-icon .box-use-tag {
      --check-opacity: 1;
    }

  </style>
</head>
<body>

  <!-- 
    1. Define the shape once and hide it. 
  -->
  <svg style="display: none;">
    <symbol id="static-box-symbol" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="4"></rect>
      <!-- Opacity variable handles the instant on/off state without animations -->
      <path d="M8 12l3 3 5-6" style="opacity: var(--check-opacity, 0);"></path>
    </symbol>
  </svg>

  <!-- 
    2. Reuse the hidden symbol using the <use> tag. 
  -->
  <label class="svg-toggle">
    <input type="checkbox" name="item-1" />
    <svg class="icon box-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <use href="#static-box-symbol" class="box-use-tag"></use>
    </svg>
    Subscribe to Newsletter
  </label>

  <label class="svg-toggle">
    <input type="checkbox" name="item-2" />
    <svg class="icon box-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <use href="#static-box-symbol" class="box-use-tag"></use>
    </svg>
    Accept Terms & Conditions
  </label>

  <label class="svg-toggle">
    <input type="checkbox" name="item-3" />
    <svg class="icon box-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <use href="#static-box-symbol" class="box-use-tag"></use>
    </svg>
    Remember Me
  </label>

</body>
</html>
