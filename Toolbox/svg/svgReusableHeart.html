<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Sprite Checkboxes</title>
  
  <!-- Import Pangolin Font -->
  <link href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
  
  <style>
    /* Global Variables */
    :root {
      --body-bg: #1e1e24;
      --col-card-bg: #59768f;
      --body-text: #e6e6eb;
    }

    /* Basic page setup to demonstrate the dark theme */
    body {
      background-color: var(--body-bg);
      color: var(--body-text);
      font-family: 'Pangolin', cursive;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px; /* Spaces out the checkboxes */
    }

    /* Base Label Styling */
    .svg-toggle {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      font-size: 1.2rem;
      user-select: none;
      color: var(--body-text);
      transition: color 0.2s ease;
      width: fit-content;
    }

    .svg-toggle:hover {
      color: var(--col-card-bg);
    }

    /* Visually hide the native checkbox */
    .svg-toggle input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    /* Base SVG Icon Styling */
    .svg-toggle .icon {
      width: 26px;
      height: 26px;
      margin-right: 10px;
      flex-shrink: 0;
    }

    /* Sprite Instance Animations */
    .heart-icon .heart-use-tag {
      transition: fill 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: center;
    }

    /* Fill solid and scale up when checked */
    .svg-toggle input[type="checkbox"]:checked ~ .heart-icon .heart-use-tag {
      fill: currentColor;
      transform: scale(1.15);
    }
  </style>
</head>
<body>

  <!-- 
    1. Define the shape once and hide it. 
    This does not render visually on the page. 
  -->
  <svg style="display: none;">
    <symbol id="heart-symbol" viewBox="0 0 24 24">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
    </symbol>
  </svg>

  <!-- 
    2. Reuse the hidden symbol using the <use> tag. 
  -->
  <label class="svg-toggle">
    <input type="checkbox" name="item-1" />
    <svg class="icon heart-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <use href="#heart-symbol" class="heart-use-tag"></use>
    </svg>
    Add to Favorites
  </label>

  <label class="svg-toggle">
    <input type="checkbox" name="item-2" />
    <svg class="icon heart-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <use href="#heart-symbol" class="heart-use-tag"></use>
    </svg>
    Save for Later
  </label>

  <label class="svg-toggle">
    <input type="checkbox" name="item-3" />
    <svg class="icon heart-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <use href="#heart-symbol" class="heart-use-tag"></use>
    </svg>
    Like This Article
  </label>

</body>
</html>
