<!DOCTYPE html>
<html>

<head>
    <title>XML Challenge</title>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <link rel="stylesheet" type="text/css" href="/HTML-AND-CSS-PROJECTS/style/main.css">
    <script src="/HTML-AND-CSS-PROJECTS/js1/main.js" defer></script>
    <script src="/HTML-AND-CSS-PROJECTS/js1/site.js" defer></script>
</head>

<body>
    <header>
        <h1 id="page-title"></h1>
    </header>
    <div class="button-grid">
        <div class="flex-box">
            <h4 class="box-title">XML Challenge</h4>
            <div style="padding: 12px;">
                <p id="XML_Example0"></p>
                <p id="XML_Example1"></p>
            </div>
        </div>

    </div>

    <script>
        var XML_Parser, XML_Document;

        //creates a text string
        var Movie = "<movies>" +
            "<movie>" +
            "<title>Jaws</title>" +
            "<director>Steven Spielberg</director>" +
            "<starring>Roy Scheider, Robert Shaw, Richard Dreyfuss</starring>" +
            "<year>1975</year>" +
            "</movie>" +
            "<movie>" +
            "<title>Brainstorm</title>" +
            "<director>Douglas Trumbull</director>" +
            "<starring>Christopher Walken, Natalie Wood, Louise Fletcher</starring>" +
            "<year>1983</year>" +
            "</movie>" +
            "</movies>";

        //creates an XML DOM parser
        XML_Parser = new DOMParser();

        //creates a new XML DOM object using the text string
        XML_Document = XML_Parser.parseFromString(Movie, "text/xml");

        document.getElementById("XML_Example0").innerHTML =
            XML_Document.getElementsByTagName("title")[0].childNodes[0].nodeValue;

        document.getElementById("XML_Example1").innerHTML =
            XML_Document.getElementsByTagName("title")[1].childNodes[0].nodeValue;

    </script>

</body>

</html>
